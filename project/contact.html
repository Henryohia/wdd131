<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals, created my Henry Arinze Ohia on the 6th of May. I am developing and improving my web design skills.">
    <meta name="author" content="Henry Arinze Ohia">

    <title>Explore Nigeria</title>

    <link rel="stylesheet" href="styles/explore-nigeria.css">
    <link rel="stylesheet" href="styles/explore-nigeria-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital@0;1&display=swap" rel="stylesheet">

    <script src="scripts/explore-nigeria.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1 id="course-title">Explore Nigeria</h1>
        <button type="button" id="menu" aria-label="button"></button>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="attractions.html">Attractions</a></li>
                <li><a href="travel-guide.html">Travel Guide</a></li>
                <li><a href="food.html">Food</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Share Your Experience</h2>

        <form method="get" action="review.html">

            <!-- Attraction -->
            <fieldset>
                    <!-- <legend>Written Review</legend> -->

                    <label for="review">Write your review:</label>
                    <textarea id="review" name="review" rows="4" cols="50"></textarea>

                </fieldset>

            

            <!-- Rating -->
            <fieldset>

                <!-- <legend>Overall Rating</legend> -->

                <label for="rating">Overall Rating</label>
                <div class="stars">
                    <input type="radio" id="fivestar" name="rating" value="5" required><label for="fivestar"></label>
                    <input type="radio" id="fourstar" name="rating" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="threestar" name="rating" value="3" required><label for="threestar"></label>
                    <input type="radio" id="twostar" name="rating" value="2" required><label for="twostar"></label>
                    <input type="radio" id="onestar" name="rating" value="1" required><label for="onestar"></label>
                </div>
            </fieldset>

            <!-- Visit Date -->
            <label for="date">
                Date of Visit *
            </label>

            <input type="date" id="date" name="date" required>

            <!-- Features -->
            <fieldset class="checkbox-group">

                <label>What did you enjoy?</label>

                <label><input type="checkbox" name="features" value="Scenery"> Scenery</label>
                <label><input type="checkbox" name="features" value="Food"> Food</label>
                <label><input type="checkbox" name="features" value="Culture"> Culture</label>
                <label><input type="checkbox" name="features" value="Hospitality"> Hospitality</label>

            </fieldset>

        <!-- Written Review -->

                <fieldset>
                    <!-- <legend>Written Review</legend> -->

                    <label for="review">Write your review:</label>
                    <textarea id="review" name="review" rows="4" cols="50"></textarea>

                </fieldset>

                <!-- User Name -->
                <fieldset>
                    <!-- <legend>User Name</legend> -->

                    <label for="username">Your Name (Optional)</label>
                    <input type="text" id="username" name="username">
                </fieldset>

                <!-- Form Submission Button -->
                <input type="submit" value="Send Review">

        </form>
           
    </main>
        

    <footer>
        <p>&copy; <span id="currentyear"></span> | Henry Arinze Ohia | Lagos, Nigeria</p>
        <p id="lastModified"></p>
        <p id="reviewCount"></p>
    </footer>
</body>
</html>
